<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0B0B12"/>
      <stop offset="100%" stop-color="#1A1A28"/>
    </linearGradient>
  </defs>

  <rect width="512" height="512" rx="115" fill="url(#bg)"/>

  <!-- corner brackets, sci-fi tablet motif -->
  <path d="M 96 150 V 108 Q 96 96 108 96 H 150" fill="none" stroke="#6EE7DA" stroke-width="10" stroke-linecap="round"/>
  <path d="M 416 150 V 108 Q 416 96 404 96 H 362" fill="none" stroke="#C4B5FD" stroke-width="10" stroke-linecap="round"/>
  <path d="M 96 362 V 404 Q 96 416 108 416 H 150" fill="none" stroke="#FF9E9E" stroke-width="10" stroke-linecap="round"/>
  <path d="M 416 362 V 404 Q 416 416 404 416 H 362" fill="none" stroke="#F8FAFC" stroke-width="10" stroke-linecap="round" opacity="0.55"/>

  <!-- document outline -->
  <rect x="176" y="146" width="160" height="220" rx="20" fill="none" stroke="#F8FAFC" stroke-width="14"/>

  <!-- three color-coded lines, one per note category -->
  <rect x="204" y="196" width="104" height="16" rx="8" fill="#FF9E9E"/>
  <rect x="204" y="240" width="104" height="16" rx="8" fill="#6EE7DA"/>
  <rect x="204" y="284" width="70" height="16" rx="8" fill="#C4B5FD"/>
</svg>
