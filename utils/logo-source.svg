<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0.1" y1="0.05" x2="0.9" y2="0.95">
      <stop offset="0%" stop-color="#8B5CF6"/>
      <stop offset="100%" stop-color="#3B82F6"/>
    </linearGradient>
  </defs>

  <!-- Recreated from the reference notebook icon the user provided —
       purple-to-blue circular badge, spiral-bound notebook, three
       color-coded lines matching the app's own category colors. -->
  <circle cx="256" cy="256" r="256" fill="url(#bg)"/>

  <!-- soft shadow under the notebook -->
  <ellipse cx="252" cy="396" rx="130" ry="20" fill="#1e1b4b" opacity="0.3"/>

  <!-- spiral binding dots -->
  <g fill="#111827">
    <rect x="104" y="172" width="60" height="34" rx="17"/>
    <rect x="104" y="236" width="60" height="34" rx="17"/>
    <rect x="104" y="300" width="60" height="34" rx="17"/>
  </g>

  <!-- notebook body, centered in the circle -->
  <rect x="136" y="112" width="240" height="288" rx="28" fill="#F8FAFC"/>

  <!-- three color-coded lines, one per note category (personal / ti / reuniones) -->
  <rect x="178" y="190" width="164" height="24" rx="12" fill="#FF9E9E"/>
  <rect x="178" y="242" width="164" height="24" rx="12" fill="#6EE7DA"/>
  <rect x="178" y="294" width="110" height="24" rx="12" fill="#C4B5FD"/>
</svg>
